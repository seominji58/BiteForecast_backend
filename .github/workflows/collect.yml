# 해황 자료 자동 수집 (2026-11-11 사용자 승인)
# - 매시 17분 1회 실행 (공공데이터포털 정각 혼잡 피함). 수동 실행: Actions 탭 → Run workflow
# - main 브랜치 코드만 실행. 다른 사람의 PR·포크에서는 돌지 않는다 (공개 저장소)
# - 비밀값: DATABASE_URL(Supabase), DATA_GO_KR_API_KEY. 로그에 출력하지 않는다 (GitHub 자동 가림 + logsafe)
name: 해황 자동 수집

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'seominji58/BiteForecast_backend'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: 패키지 설치
        run: pip install -q -r requirements.txt
      - name: 수집 1회
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: python -m app.jobs.collect

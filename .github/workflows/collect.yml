# 해황 자료 자동 수집 (2026-11-11 사용자 승인)
# - 수동 실행: Actions 탭 → Run workflow (정기 수집은 Fly collector 머신)
# - main 브랜치 코드만 실행. 다른 사람의 PR·포크에서는 돌지 않는다 (공개 저장소)
# - 비밀값: DATABASE_URL(Supabase), DATA_GO_KR_API_KEY. 로그에 출력하지 않는다 (GitHub 자동 가림 + logsafe)
name: 해황 자동 수집

# 2026-11-16: 예약 실행은 GitHub 가 4~8시간씩 미뤄서 Fly.io 예약 머신(collector, 매시간)으로 옮겼다.
# 여기는 수동 실행용 백업으로만 남긴다 (둘이 같이 돌지 않게 schedule 은 끔)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'seominji58/BiteForecast_backend'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: 패키지 설치
        run: pip install -q -r requirements.txt
      - name: 수집 1회
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: python -m app.jobs.collect

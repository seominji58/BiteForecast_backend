# Fly.io 설정 (2026-11-11 사용자 승인: 작은 서버 1대, 도쿄)
# 비밀값: fly secrets set DATABASE_URL=… (파일에 두지 않음)
app = "biteforecast-api"
primary_region = "nrt"  # 도쿄 — Supabase(서울)와 가장 가까운 Fly 지역

[env]
  APP_ENV = "prod"
  MEDIA_DIR = "/data/media"

[http_service]
  internal_port = 8080
  force_https = true
  # 요청이 없으면 멈추고, 요청이 오면 다시 켠다 (비용 절약, 첫 요청 몇 초 지연)
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/v1/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# 사진 보존용 볼륨 (1GB). 서버를 다시 만들어도 사진이 남는다
[mounts]
  source = "media"
  destination = "/data"
